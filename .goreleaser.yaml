version: 2

project_name: cassie

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: cassie
    main: ./cmd/cassie
    binary: cassie
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - ids: [cassie]
    name_template: >-
      cassie_{{ .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
